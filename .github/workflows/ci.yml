name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y

      - name: Coverage
        run: .\check_coverage.ps1

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Build Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cmake -B build-release -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release

      - name: Upload Release Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: j-exe
          path: |
            build-release\j.exe
            build-release\jc.exe
            CHANGELOG.md

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: j-exe
          path: release

      - name: List Release Files
        run: find release -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            release/build-release/j.exe
            release/build-release/jc.exe
            release/CHANGELOG.md
          generate_release_notes: true
